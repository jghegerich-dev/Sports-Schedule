<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>App Hub</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #eef0f3;
    --text: #16181d;
    --text-muted: #5b6472;
    --border: #e1e4e9;
    --shadow: 0 1px 3px rgba(16, 20, 30, 0.08), 0 1px 2px rgba(16, 20, 30, 0.06);
    --radius: 14px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  [data-theme="dark"] {
    --bg: #0f1115;
    --surface: #171a21;
    --surface-2: #1e222b;
    --text: #eef1f6;
    --text-muted: #9aa3b2;
    --border: #2a2f3a;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.3);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    transition: background 0.2s ease, color 0.2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px;
  }
  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    border-radius: 8px;
    width: 40px;
    height: 40px;
    font-size: 18px;
    cursor: pointer;
  }
  .theme-toggle:hover { background: var(--border); }
  h1 { margin: 0 0 6px; font-size: 26px; text-align: center; }
  .subtitle { margin: 0 0 40px; color: var(--text-muted); text-align: center; font-size: 14px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
    max-width: 720px;
    width: 100%;
  }
  .app-card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 24px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .app-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.12); }
  .app-icon {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: #fff;
    margin-bottom: 16px;
  }
  .app-card.sports .app-icon { background: linear-gradient(135deg, #0c2340, #bd3039); }
  .app-card.plat .app-icon { background: linear-gradient(135deg, #003791, #0070d1); }
  .app-card h2 { margin: 0 0 6px; font-size: 18px; }
  .app-card p { margin: 0; font-size: 13px; color: var(--text-muted); line-height: 1.5; }
</style>
</head>
<body>

<button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>

<h1>App Hub</h1>
<p class="subtitle">Pick an app to open</p>

<div class="grid">
  <a class="app-card sports" href="index.html">
    <div class="app-icon">🏈</div>
    <h2>Boston Sports Tracker</h2>
    <p>Scores, player stats, schedule, and standings for the Patriots, Red Sox, and Celtics.</p>
  </a>
  <a class="app-card plat" href="platinum-leaderboard/index.html">
    <div class="app-icon">🏆</div>
    <h2>Platinum Leaderboard</h2>
    <p>A scored leaderboard for PlayStation platinum trophies, weighted by difficulty, time, and rarity.</p>
  </a>
</div>

<script>
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    document.getElementById("theme-toggle").textContent = theme === "dark" ? "☀️" : "🌙";
    localStorage.setItem("hub-theme", theme);
  }
  const saved = localStorage.getItem("hub-theme");
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(saved || (prefersDark ? "dark" : "light"));
  document.getElementById("theme-toggle").addEventListener("click", () => {
    const current = document.documentElement.getAttribute("data-theme");
    applyTheme(current === "dark" ? "light" : "dark");
  });
</script>
</body>
</html>
